# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Test Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-26

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install .NET MAUI Workload
      run: dotnet workload install maui
      # if: runner.os == 'macOS' # reenable when .NET 8 is default on hosted runners

    - name: Select Xcode Version
      # run: ls -1 /Library/Developer/CommandLineTools
      run: sudo xcode-select -s /Applications/Xcode_26.5.app
      # run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer; sudo xcode-select -s /Library/Developer/CommandLineTools
      
    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal

    - name: Upload dotnet test results
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-results-${{ github.event.repository.updated_at}}
        path: TestResults-${{ github.event.repository.updated_at}}
